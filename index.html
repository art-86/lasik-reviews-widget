</main><script type="module">
const allowedOrigins = ["https://zrenie.lasik.ru"];
if (allowedOrigins.length && window.parent !== window) {
  const ancestors = Array.from(location.ancestorOrigins || []);
  if (!ancestors.length && document.referrer) ancestors.push(new URL(document.referrer).origin);
  if (!ancestors.length || ancestors.some(origin => !allowedOrigins.includes(origin))) {
    document.querySelector('.stage').remove();
    throw new Error('Embedding disabled on this domain');
  }
}
const params = new URLSearchParams(location.search);
const org = params.get('org') ?? '1012232570';
const validOrg = /^\d{1,20}$/.test(org);
for (const link of document.querySelectorAll('a[href*="/maps/org/1012232570/"]')) {
  if (validOrg) link.href = link.href.replace('/1012232570/', '/' + org + '/');
  else link.removeAttribute('href');
}
function sizeEmbed() {
  // Older Zero Blocks can give the iframe a 560px viewport on a 320px phone.
  const width = Math.min(window.innerWidth, window.screen.width || window.innerWidth);
  document.documentElement.style.setProperty('--device-width', width + 'px');
  document.documentElement.classList.add('compact-widget');
}
sizeEmbed();
window.addEventListener('resize', sizeEmbed);
const glass = document.querySelector('.glass');
const screen = glass.querySelector('.screen');
function fitScreen() {
  const scale = glass.clientWidth / screen.offsetWidth;
  if (!scale) return;
  screen.style.transform = 'scale(' + scale + ')';
  screen.style.height = glass.clientHeight / scale + 'px';
}
fitScreen();
new ResizeObserver(fitScreen).observe(glass);
const feed = document.querySelector('#feed');
const status = document.querySelector('#status');

const more = document.querySelector('#more');
let offset = 0;
let loading = false;
const seen = new Set();
async function load() {
  if (loading || offset === null) return;
  loading = true;
  more.disabled = true;
  try {
  if (!validOrg) throw new Error();
  const response = await fetch('./feed/' + org + '/' + offset + '.json');
  if (response.status === 404) {
    status.textContent = 'Эта организация еще не подключена.';
    more.hidden = true;
    offset = null;
    return;
  }
  if (!response.ok) throw new Error();
  const { name, reviews, next, total, available, aspects, rating } = await response.json();
  document.querySelector('#org-name').textContent = name;
  document.title = 'Отзывы — ' + name;
  if (rating?.ratingValue && Number.isFinite(rating.ratingCount)) {
    const n = rating.ratingCount;
    document.querySelector('#score').textContent = Number(rating.ratingValue).toLocaleString('ru-RU',{minimumFractionDigits:1,maximumFractionDigits:1});
    document.querySelector('#votes').textContent = n + ' ' + ({one:'оценка',few:'оценки',many:'оценок'}[new Intl.PluralRules('ru').select(n)] || 'оценок');
    document.querySelector('#ratingBox').hidden = false;
  }
  if (aspects) {
    const topics = document.querySelector('#topics');
    topics.replaceChildren();
    for (const a of aspects.filter(a => a.count > 0)) {
      const chip = document.createElement('div');
      const pct = document.createElement('em');
      pct.textContent = Math.round(a.positive / a.count * 100) + '%';
      const count = document.createElement('small');
      const form = new Intl.PluralRules('ru').select(a.count);
      count.textContent = a.count + ' ' + ({one:'отзыв',few:'отзыва',many:'отзывов'}[form] || 'отзывов');
      pct.append(' ', document.querySelector('#like').content.cloneNode(true));
      chip.append(a.text + ' · ', pct, count);
      topics.append(chip);
    }
  }
  for (const review of reviews) {
    if (review.id && seen.has(review.id)) continue;
    seen.add(review.id);
    const card = document.createElement('article');
    const head = document.createElement('header');
    const author = document.createElement('strong');
    const date = document.createElement('small');
    const text = document.createElement('p');
    author.textContent = review.author;
    date.textContent = review.date;
    text.textContent = review.text || ('Оценка: ' + review.rating + ' из 5');
        const avatar = document.createElement('span');
    avatar.className = 'avatar';
    avatar.textContent = review.author.trim().slice(0,1);
    const stars = document.createElement('b');
    stars.textContent = '★'.repeat(Math.max(0, Math.min(5, Math.round(Number(review.rating) || 0))));
    stars.setAttribute('aria-label', review.rating + ' из 5');
        if (review.avatar) {
      const img = new Image();
      img.className = 'avatar';
      img.loading = 'lazy';
      img.alt = '';
      img.src = review.avatar;
      img.onerror = () => img.replaceWith(avatar);
      head.append(img);
    } else head.append(avatar);
    const identity = document.createElement('div');
    identity.className = 'identity';
    const caption = document.createElement('small');
    caption.textContent = review.caption || '';
    identity.append(author, caption);
    head.append(identity);
    const details = document.createElement('div');
    details.className = 'details';
    details.append(stars, date);
    card.append(head, details, text);
    feed.append(card);
    text.classList.add('collapsed');
    if (text.scrollHeight > text.clientHeight + 1) {
      const expand = document.createElement('button');
      expand.className = 'expand';
      expand.textContent = 'ещё';
      expand.onclick = () => { text.classList.remove('collapsed'); expand.remove(); };
      card.append(expand);
    }
    const url = 'https://yandex.ru/maps/org/' + org + '/reviews/?reviews%5BpublicId%5D=' + encodeURIComponent(review.id);
    const actions = document.createElement('div');
    actions.className = 'actions';
    for (const [icon, value, label] of [['like',review.likes,'Лайк'],['share','','Поделиться']]) {
      const link = document.createElement('a');
      link.href = url;
      link.target = '_blank';
      link.setAttribute('aria-label', label + ' в Яндекс Картах');
      link.append(document.querySelector('#' + icon).content.cloneNode(true), String(value || ''));
      if (icon === 'share' && navigator.share) link.onclick = e => { e.preventDefault(); navigator.share({url}).catch(()=>{}); };
      actions.append(link);
    }
    card.append(actions);
    if (review.answer) {
      const answer = document.createElement('details');
      answer.className = 'answer';
      const summary = document.createElement('summary');
      summary.textContent = 'Посмотреть ответ организации';
      answer.append(summary, review.answer);
      card.append(answer);
    }
  }
    document.querySelector('#count').textContent = total;
    offset = next;
    status.textContent = 'Показано ' + feed.children.length + ' из ' + available;
    more.hidden = next === null;
  } catch {
    status.textContent = 'Не удалось загрузить отзывы.';
    more.textContent = 'Повторить';
  } finally {
    more.disabled = false;
    loading = false;
  }
}
const strip = document.querySelector('#topics');
let drag = null;
strip.addEventListener('pointerdown', e => {
  if (e.pointerType !== 'mouse' || e.button !== 0) return;
  drag = { x: e.clientX, left: strip.scrollLeft };
  strip.setPointerCapture(e.pointerId);
  strip.classList.add('dragging');
});
strip.addEventListener('pointermove', e => {
  if (drag) strip.scrollLeft = drag.left + drag.x - e.clientX;
});
strip.addEventListener('lostpointercapture', () => {
  drag = null;
  strip.classList.remove('dragging');
});
strip.addEventListener('wheel', e => {
  if (e.ctrlKey || e.shiftKey || Math.abs(e.deltaX) >= Math.abs(e.deltaY)) return;
  const before = strip.scrollLeft;
  strip.scrollLeft += e.deltaY * (e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? strip.clientWidth : 1);
  if (strip.scrollLeft !== before) e.preventDefault();
}, { passive: false });
more.addEventListener('click', load);
new IntersectionObserver(([entry]) => {
  if (entry.isIntersecting) load();
}, { root: document.querySelector('.scroll'), rootMargin: '150px' }).observe(more);
</script></html>
